spring.application.name=sisfer

# En local las variables (DB_URL, DB_PASSWORD...) se leen de ferreteria-backend/.env (ver .env.example).
# En Render no existe ese archivo y se usan las variables del panel.
spring.config.import=optional:file:.env[.properties]

# 1. Ajuste en URL: agregamos 'allowPublicKeyRetrieval=true' para evitar fallos de autenticación con root en MySQL 8+
# En producción (Render) se definen DB_URL, DB_USERNAME y DB_PASSWORD con los datos de Aiven
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sisfer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. DIALECTO EXPLÍCITO (Solución direct al error de Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}

# Esquema versionado con Flyway (src/main/resources/db/migration).
# Base vacía (local nueva): ejecuta V1..Vn. Base existente sin historial (Aiven): la marca
# en la versión 4, que ya tiene aplicada a mano, y desde ahí solo corre lo nuevo.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4
spring.flyway.baseline-description=Esquema existente antes de Flyway
spring.sql.init.mode=never

# Plantillas y Mensajes
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.main.allow-circular-references=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

#CONFIGURACION DE CORREO PARA CODIGO DE RECUPERACION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ferreteria.lasolucion53@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# DESPLIEGUE (Render)
# Render asigna el puerto en la variable PORT y pone un proxy HTTPS delante
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Frontend y backend en dominios distintos: la cookie de sesión debe ser SameSite=None y Secure.
# En local (http) se dejan los valores por defecto.
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# URL del frontend para el enlace de activación de cuenta enviado por correo
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
