# Blueprint de Render: crea el backend (Docker) y el frontend (sitio estático) juntos.
# Las variables con "sync: false" se piden en el panel de Render al crear el Blueprint.
services:
  - type: web
    name: ferreteria-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:mysql://mysql-36fb4e0-manuel1508vc-12e7.j.aivencloud.com:25756/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://ferreteria-frontend.onrender.com
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SHOW_SQL
        value: "false"

  - type: web
    name: ferreteria-frontend
    runtime: static
    repo: https://github.com/VictorFernandez-Hub/frontend_sisfer
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/ferreteria-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
